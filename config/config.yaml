app:
  name: PROF_2027
  env: "${PROF2027_ENV:prod}"

paths:
  data_dir: "data"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  incoming_dir: "data/incoming"
  artifacts_dir: "data/artifacts"
  quarantine_dir: "data/quarantine"
  models_dir: "models"
  reports_dir: "reports"
  logs_dir: "logs"

db:
  path: "${PROF2027_DB_PATH:data/prof2027.db}"

dashboard:
  host: "127.0.0.1"
  port: 8050
  auto_reload_sec: 30

api:
  host: "127.0.0.1"
  port: 8000
  api_key: "${PROF2027_API_KEY:}"

bot:
  token: "${PROF2027_TELEGRAM_TOKEN:}"
  admin_ids: "${PROF2027_TELEGRAM_ADMIN_IDS:}"

users:
  admin:
    username: "${PROF2027_ADMIN_USER:admin}"
    password: "${PROF2027_ADMIN_PASSWORD:admin}"
    role: admin
  analyst:
    username: "${PROF2027_ANALYST_USER:analyst}"
    password: "${PROF2027_ANALYST_PASSWORD:analyst}"
    role: analyst
  viewer:
    username: "${PROF2027_VIEWER_USER:viewer}"
    password: "${PROF2027_VIEWER_PASSWORD:viewer}"
    role: viewer

# Входные файлы: белый список расширений и лимиты
ingestion:
  allowed_extensions:
    - .pdf
    - .docx
    - .doc
    - .pptx
    - .ppt
    - .rtf
    - .txt
    - .md
    - .html
    - .htm
    - .png
    - .jpg
    - .jpeg
    - .webp
    - .bmp
    - .tiff
    - .mp4
    - .mov
    - .avi
    - .mkv
    - .mp3
    - .epub
    - .fb2
  max_file_mb: 100
  max_video_mb: 500
  max_total_mb_per_run: 8192
  allow_archives: false

moderation:
  approved_threshold: 0.7
  needs_review_threshold: 0.4

complexity:
  levels: 5

ml:
  random_state: 42
  test_size: 0.2
  group_fold: "subject"
