# Методические требования: 8 категорий × 3 требования = 24.
# Замена набора = положить новый YAML и перезапустить систему (классификатор строит вопросы сам).

- category: "Научная достоверность и актуальность"
  requirements:
    - "Отсутствие фактических ошибок"
    - "Корректность терминологии"
    - "Актуальность информации и источников"

- category: "Методическая целесообразность"
  requirements:
    - "Соответствие материала целям обучения"
    - "Наличие понятных инструкций"
    - "Наличие обратной связи и самопроверки"

- category: "Возрастная доступность"
  requirements:
    - "Соответствие сложности возрасту обучающихся"
    - "Понятность формулировок"
    - "Достаточность пояснений и примеров"

- category: "Структура и логика"
  requirements:
    - "Последовательность изложения"
    - "Системность содержания"
    - "Наличие логических связей между разделами"

- category: "Практическая направленность"
  requirements:
    - "Наличие практических заданий"
    - "Связь с реальными ситуациями"
    - "Развитие критического и аналитического мышления"

- category: "Качество оформления"
  requirements:
    - "Читаемость текста"
    - "Качество иллюстраций и схем"
    - "Единый стиль оформления"

- category: "Доступность и дифференциация"
  requirements:
    - "Наличие заданий разного уровня сложности"
    - "Возможность индивидуального подхода"
    - "Доступность информации для разных категорий обучающихся"

- category: "Безопасность и правомерность"
  requirements:
    - "Соблюдение авторских прав"
    - "Корректное указание источников"
    - "Отсутствие запрещённой информации"
