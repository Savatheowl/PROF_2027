# Типы занятий (универсально для школы, СПО и вуза).
class_types:
  - lesson         # урок
  - lecture        # лекция
  - seminar        # семинар
  - practical      # практическое занятие
  - lab            # лабораторное занятие
  - control        # контрольное занятие
  - project        # проектное занятие
  - independent    # самостоятельная работа
  - elective       # электив/факультатив
  - coursework     # курсовая работа
  - practice       # производственная/учебная практика
  - unknown        # не определено
