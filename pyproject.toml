[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prof2027"
version = "0.1.0"
description = "Универсальная мультиагентная система для учебных материалов (школа / СПО / вуз)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "PROF_2027" }]
dependencies = [
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# TODO(phase 7): aiogram>=3.0
# TODO(phase 6): dash, plotly, matplotlib
# TODO(phase 4): xgboost, catboost, evidently
# TODO(phase 1): pymupdf, python-docx, python-pptx, beautifulsoup4, opencv-python-headless, Pillow

[project.scripts]
prof2027 = "prof2027.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
